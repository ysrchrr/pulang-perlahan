services:
  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    image: php8.3-laravel:apache-bullseye
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    volumes:
      - ${PROJECT_PATH}:/var/www/html:delegated
    ports:
      - '${CONTAINER_PORT}:80'
    command: >
      bash -c "
      composer install &&
      chmod -R 775 /var/www/html/storage &&
      chown -R www-data:www-data /var/www/html/storage &&
      php artisan storage:link &&
      apache2-foreground
      "
    networks:
      - uns_pengaduan

networks:
  uns_pengaduan:
    driver: bridge
    ipam:
      config:
        - subnet: 164.8.0.0/16

